# This workflow builds the html inside action on github runner

name: Deploy to dev VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the DEPENDENT repository into a subfolder named 'tradeServer'
      - name: Checkout Dependent Repo
        uses: actions/checkout@v4
        with:
          repository: "Abhimanyu6676/tradeServer"
          ref: "develop" # <-- Forces checkout to the develop branch
          token: ${{ secrets.DEPENDENT_REPO_PAT }} # Uncomment if tradeServer is private
          path: "tradeServer"

      # 2. Clone the CURRENT frontend repository into a sibling folder named 'trade'
      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          ref: "develop" # <-- Forces checkout to the develop branch
          path: "trade"

      # 3. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"       
          cache-dependency-path: "./trade/package-lock.json" # Fixed the double quotes here

      # 4. Build happens here on GitHub's powerful runner
      - name: Build Frontend
        working-directory: "./trade"
        run: |
          npm ci
          npm run build

      # 5. Securely upload the built files from GitHub to your Lightsail VPS
      - name: Copy files via SCP to Lightsail
        uses: appleboy/scp-action@v0.1.7 # Changed from ssh-action to scp-action to allow file transfers
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT || 22 }}
          source: "trade/public/*" # Change 'public/*' to 'dist/*' or 'build/*' if your framework uses a different output folder
          target: "/var/www/trade"
          strip_components: 2 # Strips 'trade/' and 'public/' so only the raw contents inside public go into /var/www/trade
