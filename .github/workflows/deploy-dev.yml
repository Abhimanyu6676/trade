# This workflow builds the html inside action on github runner

name: Deploy to dev VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the DEPENDENT repository into a subfolder named 'tradeServer'
      - name: Checkout Dependent Repo
        uses: actions/checkout@v4
        with:
          repository: "Abhimanyu6676/tradeServer"
          ref: "develop" # <-- Forces checkout to the develop branch
          token: ${{ secrets.DEPENDENT_REPO_PAT }} # Uncomment if tradeServer is private
          path: "tradeServer"

      # 2. Clone the CURRENT frontend repository into a sibling folder named 'trade'
      - name: Checkout Frontend Repo
        uses: actions/checkout@v4
        with:
          ref: "develop" # <-- Forces checkout to the develop branch
          path: "trade"

      # 3. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # cache: "npm"
          # cache-dependency-path: "./trade/package-lock.json" # Fixed the double quotes here

      # 4. Cache npm global cache for both repositories
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          # The cache key changes whenever either package-lock.json is altered
          key: ${{ runner.os }}-node-${{ hashFiles('trade/package-lock.json', 'tradeServer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 5. Install dependencies for the DEPENDENT repository
      - name: Install Dependent Repo Dependencies
        working-directory: "./tradeServer"
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 6. Build happens here on GitHub's powerful runner
      - name: Build Frontend
        working-directory: "./trade"
        run: |
          npm ci
          npm run build

      # 7. Securely upload the built files from GitHub to your Lightsail VPS
      - name: Copy files via SCP to Lightsail
        uses: appleboy/scp-action@v0.1.7 # Changed from ssh-action to scp-action to allow file transfers
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT || 22 }}
          source: "trade/public/*" # Change 'public/*' to 'dist/*' or 'build/*' if your framework uses a different output folder
          target: "~/trade-temp"
          strip_components: 2 # Strips 'trade/' and 'public/' so only the raw contents inside public go into /var/www/trade

      # 8. Move files to /var/www using sudo permissions on the server
      - name: Move files to Web Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT || 22 }}
          script: |
            # Clear out old files
            sudo rm -rf /var/www/trade
            # Create the folder with sudo if it doesn't exist
            sudo mkdir -p /var/www/trade
            # Move the new files in
            sudo cp -r ~/trade-temp/* /var/www/trade/
            # Clean up the temp folder
            rm -rf ~/trade-temp
